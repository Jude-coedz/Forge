name: Verify Forge preview API

on:
  push:
    branches: [fix-gemini-runtime-and-ui]
    paths: [.github/workflows/smoke-preview.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Diagnose preview connectivity
        run: |
          set +e
          echo "Static page request:"
          curl --verbose --connect-timeout 6 --max-time 16 -sS -o /tmp/forge-static.txt -w "STATIC HTTP %{http_code} TCP %{time_connect}s TLS %{time_appconnect}s total %{time_total}s\n" "https://forge-pqyxnvyuf-eeakede-9301.vercel.app/"
          echo "Static body prefix:"
          head -c 180 /tmp/forge-static.txt || true
          echo
          echo "Health function request:"
          curl --verbose --connect-timeout 6 --max-time 16 -sS -o /tmp/forge-health.txt -w "HEALTH HTTP %{http_code} TCP %{time_connect}s TLS %{time_appconnect}s total %{time_total}s\n" "https://forge-pqyxnvyuf-eeakede-9301.vercel.app/api/forge/turn"
          echo "Health body prefix:"
          head -c 320 /tmp/forge-health.txt || true
          echo
