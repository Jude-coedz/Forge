name: Verify Forge preview API

on:
  push:
    branches: [fix-gemini-runtime-and-ui]
    paths: [.github/workflows/smoke-preview.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Distinguish static, standalone Node, and Forge API
        run: |
          set +e
          BASE="https://forge-cw4jcsdti-eeakede-9301.vercel.app"
          for ROUTE in / /api/ping /api/forge/turn; do
            echo "CHECK $ROUTE"
            curl --connect-timeout 6 --max-time 14 -sS -o /tmp/forge-result -w "HTTP %{http_code} TCP %{time_connect}s total %{time_total}s\n" "$BASE$ROUTE"
            echo "curl exit $?"
            head -c 300 /tmp/forge-result || true
            echo
          done
